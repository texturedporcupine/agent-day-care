<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Day Care</title>
    <style>
      :root {
        --bg: #1a1c2c;
        --panel: #29366f;
        --text: #f4f4f4;
        --accent: #a7f070;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Courier New", monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      #status-bar {
        width: 100%;
        max-width: 1024px;
        display: flex;
        gap: 16px;
        justify-content: center;
        align-items: center;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 4px solid #0f1230;
        font-size: 14px;
        letter-spacing: 1px;
        image-rendering: pixelated;
      }
      #status-bar .stat { display: flex; gap: 6px; align-items: center; }
      #status-bar .dot { width: 10px; height: 10px; display: inline-block; }
      .dot.working { background: #a7f070; }
      .dot.napping { background: #73eff7; }
      .dot.fainted { background: #ef7d57; }
      #status-bar .tokens { color: var(--accent); }
      #status-bar .conn { margin-left: auto; font-size: 11px; opacity: 0.7; }
      #game {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }
      canvas { image-rendering: pixelated; }
      #empty-state {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 10px 16px;
        background: rgba(15, 18, 48, 0.85);
        border: 2px solid var(--panel);
        color: var(--text);
        font-size: 13px;
        letter-spacing: 1px;
        text-align: center;
        pointer-events: none;
      }
      #empty-state.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="status-bar">
      <span class="stat"><span class="dot working"></span>working <b id="count-working">0</b></span>
      <span class="stat"><span class="dot napping"></span>napping <b id="count-napping">0</b></span>
      <span class="stat"><span class="dot fainted"></span>fainted <b id="count-fainted">0</b></span>
      <span class="stat tokens">tokens today <b id="count-tokens">0</b></span>
      <span class="conn" id="conn-status">connecting…</span>
    </div>
    <div id="game">
      <div id="empty-state" class="hidden">connecting to the bus…</div>
    </div>
    <script type="module" src="/client/main.ts"></script>
  </body>
</html>
