<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Agent Day Care</title>
    <style>
      /* Pokémon Black 2 / White 2 menu theme: dark slate backdrop, black
         info bar, white rounded panels with thick outlines, cyan accents. */
      :root {
        --bg: #2e3840;
        --bg-grid: #333f48;
        --bar: #101418;
        --bar-border: #48b0e0;
        --panel-face: #f8f8f8;
        --panel-border: #22282e;
        --panel-bevel: #b8c4cc;
        --card-face: #eef4f8;
        --card-border: #c2ced8;
        --text-light: #f4f4f4;
        --text-dark: #303840;
        --muted: #6e8090;
        --accent: #48b0e0;
        --accent-link: #1e88c8;
        --tokens: #f8c850;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background:
          repeating-linear-gradient(45deg, var(--bg) 0 12px, var(--bg-grid) 12px 24px);
        color: var(--text-light);
        font-family: "Courier New", monospace;
        min-height: 100vh;
      }
      #status-bar {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
        align-items: center;
        padding: 8px 12px;
        background: var(--bar);
        border-bottom: 3px solid var(--bar-border);
        font-size: 14px;
        letter-spacing: 1px;
        image-rendering: pixelated;
      }
      #status-bar .stat { display: flex; gap: 6px; align-items: center; }
      #status-bar .dot {
        width: 10px;
        height: 10px;
        display: inline-block;
        border-radius: 2px;
        box-shadow: 0 0 4px rgba(255, 255, 255, 0.25);
      }
      .dot.thinking { background: #f8c850; }
      .dot.working { background: #78d048; }
      .dot.levelup { background: #c880e8; }
      .dot.napping { background: #58c8e8; }
      .dot.fainted { background: #f05868; }
      #status-bar .tokens { color: var(--tokens); }
      #status-bar .conn { margin-left: auto; font-size: 11px; opacity: 0.8; }
      #notify-toggle {
        padding: 2px 8px;
        color: var(--text-light);
        font-family: inherit;
        font-size: 11px;
        background: transparent;
        border: 1px solid var(--muted);
        border-radius: 4px;
        cursor: pointer;
      }
      #notify-toggle.enabled { border-color: var(--accent); color: var(--accent); }
      #workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 14px;
        width: 100%;
        min-height: calc(100vh - 40px);
        padding: 14px;
      }
      #game {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        min-height: 400px;
        width: 100%;
        overflow: hidden;
        background: #1a2028;
        border: 3px solid var(--panel-border);
        border-radius: 8px;
        box-shadow: inset 0 0 0 2px var(--panel-bevel), 0 3px 0 rgba(0, 0, 0, 0.35);
      }
      canvas { image-rendering: pixelated; }
      #empty-state {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 10px 16px;
        background: var(--panel-face);
        border: 3px solid var(--panel-border);
        border-radius: 6px;
        color: var(--text-dark);
        font-size: 13px;
        letter-spacing: 1px;
        text-align: center;
        pointer-events: none;
      }
      #empty-state.hidden { display: none; }
      #threads-panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--panel-face);
        border: 3px solid var(--panel-border);
        border-radius: 8px;
        box-shadow: inset 0 0 0 2px var(--panel-bevel), 0 3px 0 rgba(0, 0, 0, 0.35);
        color: var(--text-dark);
        overflow: hidden;
      }
      .panel-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        background: var(--accent);
        border-bottom: 3px solid var(--panel-border);
      }
      .panel-heading h1 {
        margin: 0;
        font-size: 15px;
        letter-spacing: 1px;
        color: #ffffff;
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.35);
        text-transform: uppercase;
      }
      #thread-total {
        color: #eaf6fc;
        font-size: 11px;
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.3);
      }
      #thread-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        overflow-y: auto;
      }
      .bucket-heading {
        margin-top: 4px;
        padding: 3px 8px;
        font-size: 10px;
        font-weight: bold;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #ffffff;
        border-radius: 4px;
      }
      .bucket-heading.bucket-needs-you { background: #e05868; }
      .bucket-heading.bucket-running { background: #58a838; }
      .bucket-heading.bucket-idle { background: #90a0b0; }
      .thread-meta-wrap {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .thread-dismiss {
        padding: 0 6px;
        color: #ffffff;
        font-family: inherit;
        font-size: 10px;
        line-height: 16px;
        background: #58a838;
        border: none;
        border-radius: 3px;
        cursor: pointer;
      }
      .thread-dismiss:hover { background: #6cc247; }
      .thread-followup {
        grid-column: 2 / 4;
        overflow: hidden;
        color: var(--muted);
        font-size: 10px;
        font-style: italic;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .thread-card {
        display: grid;
        grid-template-columns: 10px minmax(0, 1fr) auto;
        gap: 8px;
        align-items: start;
        padding: 10px;
        color: var(--text-dark);
        background: var(--card-face);
        border: 2px solid var(--card-border);
        border-radius: 6px;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.08);
      }
      a.thread-name {
        color: inherit;
        text-decoration: none;
      }
      a.thread-name:hover,
      a.thread-name:focus-visible {
        color: var(--accent-link);
        outline: none;
      }
      .thread-links {
        display: flex;
        gap: 10px;
        align-items: baseline;
        grid-column: 2 / 4;
        min-width: 0;
        font-size: 10px;
      }
      .thread-links a {
        flex-shrink: 0;
        color: var(--accent-link);
        font-weight: bold;
        text-decoration: none;
      }
      .thread-links a:hover { text-decoration: underline; }
      .thread-repo {
        flex-shrink: 0;
        padding: 1px 5px;
        color: #ffffff;
        font-family: inherit;
        font-size: inherit;
        font-weight: bold;
        background: var(--accent);
        border: none;
        border-radius: 3px;
        cursor: pointer;
      }
      .thread-repo:hover { background: #38a0d0; }
      .thread-repo.active { outline: 2px solid #ffffff; }
      .thread-branch {
        overflow: hidden;
        color: var(--muted);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .thread-task {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        grid-column: 2 / 4;
        overflow: hidden;
        color: var(--text-dark);
        font-size: 11px;
        line-height: 1.35;
      }
      .thread-state {
        width: 10px;
        height: 10px;
        margin-top: 2px;
        border-radius: 2px;
        background: var(--state-color);
        box-shadow: 0 0 5px var(--state-color);
      }
      .thread-name {
        overflow: hidden;
        font-size: 12px;
        font-weight: bold;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .thread-activity {
        grid-column: 2 / 4;
        min-height: 14px;
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .thread-meta {
        color: var(--muted);
        font-size: 9px;
        text-transform: uppercase;
        white-space: nowrap;
      }
      #threads-empty {
        padding: 24px 8px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
        text-align: center;
      }
      #threads-empty.hidden { display: none; }
      @media (max-width: 860px) {
        #workspace {
          grid-template-columns: 1fr;
        }
        #threads-panel {
          max-height: 360px;
        }
        #status-bar .conn {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="status-bar">
      <span class="stat"><span class="dot thinking"></span>thinking <b id="count-thinking">0</b></span>
      <span class="stat"><span class="dot working"></span>working <b id="count-working">0</b></span>
      <span class="stat"><span class="dot levelup"></span>ready <b id="count-levelup">0</b></span>
      <span class="stat"><span class="dot napping"></span>napping <b id="count-napping">0</b></span>
      <span class="stat"><span class="dot fainted"></span>fainted <b id="count-fainted">0</b></span>
      <span class="stat tokens">tokens today <b id="count-tokens">0</b></span>
      <button id="notify-toggle" type="button">🔔 notify</button>
      <span class="conn" id="conn-status">connecting…</span>
    </div>
    <main id="workspace">
      <div id="game">
        <div id="empty-state" class="hidden">connecting to the bus…</div>
      </div>
      <aside id="threads-panel" aria-labelledby="threads-title">
        <div class="panel-heading">
          <h1 id="threads-title">Active threads</h1>
          <span id="thread-total">0 threads</span>
        </div>
        <div id="thread-list" aria-live="polite"></div>
        <div id="threads-empty">Threads appear here as agents connect.</div>
      </aside>
    </main>
    <script type="module" src="/client/main.ts"></script>
  </body>
</html>
